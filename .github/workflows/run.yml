name: NewsCrawlPush
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: pip3 install requests beautifulsoup4
      - name: Run crawl script
        run: python3 crawl.py
