name: NewsSpider
on:
  schedule:
    # 北京时间 22:07 → UTC 14:07
    - cron: '7 14 * * *'
    # 北京时间 06:07 → UTC 22:07
    - cron: '7 22 * * *'
    # 北京时间 08:07 → UTC 00:07
    - cron: '7 00 * * *'
    # 北京时间 11:07 → UTC 03:07
    - cron: '7 03 * * *'
    # 北京时间 13:07 → UTC 05:07
    - cron: '7 05 * * *'
    # 北京时间 15:07 → UTC 07:07
    - cron: '7 07 * * *'
    # 北京时间 17:07 → UTC 09:07
    - cron: '7 09 * * *'
  workflow_dispatch:

jobs:
  spider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: 加载缓存历史记录
        uses: actions/cache@v5
        with:
          path: history.txt
          key: news-history-cache

      - name: 安装Python依赖
        run: pip install requests beautifulsoup4

      - name: 执行爬虫
        run: python3 crawl.py

      - name: 更新缓存
        uses: actions/cache@v5
        with:
          path: history.txt
          key: news-history-cache
