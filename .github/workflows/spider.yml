name: NewsSpider
on:
  schedule:
    # 北京时间 22:00 → UTC 14:00
    - cron: '0 14 * * *'
    # 北京时间 06:00 → UTC 22:00
    - cron: '0 22 * * *'
    # 北京时间 08:00 → UTC 00:00
    - cron: '0 00 * * *'
    # 北京时间 11:00 → UTC 03:00
    - cron: '0 03 * * *'
    # 北京时间 13:00 → UTC 05:00
    - cron: '0 05 * * *'
    # 北京时间 15:00 → UTC 07:00
    - cron: '0 07 * * *'
    # 北京时间 17:00 → UTC 09:00
    - cron: '0 09 * * *'
  workflow_dispatch:

jobs:
  spider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: 加载缓存历史记录
        uses: actions/cache@v5
        with:
          path: history.txt
          key: news-history-cache

      - name: 安装Python依赖
        run: pip install requests beautifulsoup4

      - name: 执行爬虫
        run: python3 crawl.py

      - name: 更新缓存
        uses: actions/cache@v5
        with:
          path: history.txt
          key: news-history-cache
