name: NewsSpider
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  spider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 加载缓存
        uses: actions/cache@v4
        with:
          path: history.txt
          key: news-history-cache

      - name: 安装Python依赖
        run: pip install requests beautifulsoup4

      - name: 执行爬虫
        run: python3 crawl.py

      - name: 更新缓存
        uses: actions/cache@v4
        with:
          path: history.txt
          key: news-history-cache
